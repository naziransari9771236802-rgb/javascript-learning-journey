<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Bookings - EventHub</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>


<body>

<header class="site-header">

    <div class="container navbar">

        <a href="../index.html" class="logo">
            <span class="logo-icon">✦</span>
            <span>Event<span>Hub</span></span>
        </a>

        <nav class="main-nav">

            <a href="../index.html">
                Home
            </a>

            <a href="events.html">
                Explore Events
            </a>

            <a
                href="my-bookings.html"
                class="active"
            >
                My Bookings
            </a>

            <a href="favorites.html">
                Favorites
            </a>

        </nav>

        <a
            href="profile.html"
            class="profile-avatar"
        >
            👤
        </a>

    </div>

</header>


<main>

    <section class="page-hero">

        <div class="container">

            <span class="section-label">
                Your Events
            </span>

            <h1>
                My bookings
            </h1>

            <p>
                Manage your upcoming and previous bookings.
            </p>

        </div>

    </section>


    <section class="section">

        <div class="container">

            <div class="booking-tabs">

                <button
                    class="tab-btn active"
                    data-booking-tab="upcoming"
                >
                    Upcoming
                </button>

                <button
                    class="tab-btn"
                    data-booking-tab="past"
                >
                    Past
                </button>

                <button
                    class="tab-btn"
                    data-booking-tab="cancelled"
                >
                    Cancelled
                </button>

            </div>


            <div
                class="bookings-list"
                id="bookingsList"
            >

                <!-- JavaScript generated -->

            </div>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="container footer-bottom">

        <p>
            © 2026 EventHub.
        </p>

        <p>
            Your bookings, all in one place.
        </p>

    </div>

</footer>


<script
    type="module"
    src="../js/app.js"
></script>

</body>

</html>

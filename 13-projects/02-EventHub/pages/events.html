<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Explore Events - EventHub</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>


<body>

<header class="site-header">

    <div class="container navbar">

        <a href="../index.html" class="logo">
            <span class="logo-icon">✦</span>
            <span>Event<span>Hub</span></span>
        </a>

        <nav class="main-nav">

            <a href="../index.html">
                Home
            </a>

            <a
                href="events.html"
                class="active"
            >
                Explore Events
            </a>

            <a href="my-bookings.html">
                My Bookings
            </a>

            <a href="favorites.html">
                Favorites
            </a>

        </nav>

        <div class="nav-actions">

            <a href="login.html">
                Login
            </a>

            <a
                href="register.html"
                class="btn btn-primary"
            >
                Get Started
            </a>

        </div>

    </div>

</header>


<main>

    <section class="page-hero">

        <div class="container">

            <span class="section-label">
                Discover
            </span>

            <h1>
                Explore amazing events
            </h1>

            <p>
                Find concerts, workshops, conferences,
                sports and more.
            </p>

        </div>

    </section>


    <section class="section">

        <div class="container">

            <!-- Search -->

            <div class="event-search-panel">

                <div class="search-field">

                    <span>🔎</span>

                    <input
                        type="search"
                        id="eventSearch"
                        placeholder="Search events..."
                    >

                </div>


                <select id="eventCategoryFilter">

                    <option value="all">
                        All Categories
                    </option>

                    <option value="Music">
                        Music
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Business">
                        Business
                    </option>

                    <option value="Sports">
                        Sports
                    </option>

                    <option value="Art">
                        Art
                    </option>

                    <option value="Education">
                        Education
                    </option>

                </select>


                <select id="eventLocationFilter">

                    <option value="all">
                        All Locations
                    </option>

                    <option value="Delhi">
                        Delhi
                    </option>

                    <option value="Mumbai">
                        Mumbai
                    </option>

                    <option value="Bangalore">
                        Bangalore
                    </option>

                    <option value="Lucknow">
                        Lucknow
                    </option>

                </select>


                <select id="eventSort">

                    <option value="date">
                        Date
                    </option>

                    <option value="price-low">
                        Price: Low to High
                    </option>

                    <option value="price-high">
                        Price: High to Low
                    </option>

                    <option value="popular">
                        Most Popular
                    </option>

                </select>

            </div>


            <div class="results-header">

                <div>

                    <h2>
                        Upcoming Events
                    </h2>

                    <p id="eventResultCount">
                        0 events found
                    </p>

                </div>

            </div>


            <div
                class="event-grid"
                id="allEventsGrid"
            >

                <!-- Events generated by JavaScript -->

            </div>


            <div
                class="pagination"
                id="eventPagination"
            >

            </div>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="container footer-bottom">

        <p>
            © 2026 EventHub. All rights reserved.
        </p>

        <p>
            Discover. Book. Enjoy.
        </p>

    </div>

</footer>


<script
    type="module"
    src="../js/app.js"
></script>

</body>

</html>

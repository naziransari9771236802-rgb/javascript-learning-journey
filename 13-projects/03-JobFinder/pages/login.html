<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - JobFinder</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body class="auth-page">


    <main class="auth-wrapper">


        <!-- LEFT SIDE -->

        <section class="auth-visual">

            <a
                href="../index.html"
                class="logo"
            >
                Job<span>Finder</span>
            </a>


            <div class="auth-visual-content">

                <div class="auth-icon">
                    💼
                </div>

                <h1>
                    Welcome back.
                </h1>

                <p>
                    Continue your job search and discover
                    new opportunities.
                </p>

            </div>


        </section>



        <!-- RIGHT SIDE -->

        <section class="auth-form-section">


            <div class="auth-form-container">


                <a
                    href="../index.html"
                    class="mobile-auth-logo logo"
                >
                    Job<span>Finder</span>
                </a>


                <div class="auth-heading">

                    <p class="section-label">
                        WELCOME BACK
                    </p>

                    <h2>
                        Sign in to your account
                    </h2>

                    <p>
                        Enter your details to continue.
                    </p>

                </div>



                <form id="loginForm">


                    <div class="form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div class="auth-options">

                        <label>

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            Remember me

                        </label>


                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                    >
                        Login →
                    </button>


                </form>



                <p class="auth-switch">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>


                <a
                    href="../index.html"
                    class="back-home"
                >
                    ← Back to Home
                </a>


            </div>

        </section>


    </main>



    <script src="../js/auth.js"></script>

</body>

</html>

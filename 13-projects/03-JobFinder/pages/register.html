<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - JobFinder</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body class="auth-page">


    <main class="auth-wrapper">


        <!-- LEFT -->

        <section class="auth-visual">

            <a
                href="../index.html"
                class="logo"
            >
                Job<span>Finder</span>
            </a>


            <div class="auth-visual-content">

                <div class="auth-icon">
                    🚀
                </div>

                <h1>
                    Start your journey.
                </h1>

                <p>
                    Create your profile and discover
                    opportunities made for you.
                </p>

            </div>

        </section>



        <!-- RIGHT -->

        <section class="auth-form-section">

            <div class="auth-form-container">


                <a
                    href="../index.html"
                    class="mobile-auth-logo logo"
                >
                    Job<span>Finder</span>
                </a>


                <div class="auth-heading">

                    <p class="section-label">
                        GET STARTED
                    </p>

                    <h2>
                        Create your account
                    </h2>

                    <p>
                        Join JobFinder and start your
                        career journey.
                    </p>

                </div>



                <form id="registerForm">


                    <div class="form-group">

                        <label for="registerName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="registerName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <label class="terms-checkbox">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            I agree to the Terms &
                            Conditions.
                        </span>

                    </label>


                    <button
                        type="submit"
                        class="auth-submit"
                    >
                        Create Account →
                    </button>


                </form>



                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>


                <a
                    href="../index.html"
                    class="back-home"
                >
                    ← Back to Home
                </a>


            </div>

        </section>


    </main>



    <script src="../js/auth.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | ShopEase</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>


<header class="site-header">

    <div class="container nav-container">

        <a
            href="index.html"
            class="logo"
        >
            ShopEase
        </a>


        <nav class="main-nav">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="wishlist.html">
                Wishlist ❤️
            </a>

            <a href="cart.html">
                Cart 🛒
            </a>

            <a href="orders.html">
                Orders
            </a>

            <a href="auth.html">
                Login
            </a>

        </nav>

    </div>

</header>



<main>

    <section class="page-hero">

        <div class="container">

            <p class="eyebrow">
                SECURE SHOPPING
            </p>

            <h1>
                Checkout
            </h1>

            <p>
                Complete your order safely and easily.
            </p>

        </div>

    </section>



    <section class="checkout-section">

        <div class="container checkout-layout">


            <!-- LEFT SIDE -->

            <div class="checkout-form-card">

                <h2>
                    Delivery Information
                </h2>


                <form id="checkoutForm">


                    <div class="form-row">


                        <div class="form-group">

                            <label>
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>



                        <div class="form-group">

                            <label>
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="Enter phone number"
                                required
                            >

                        </div>


                    </div>



                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email address"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label>
                            Address
                        </label>

                        <textarea
                            id="address"
                            rows="4"
                            placeholder="House no, street, area"
                            required
                        ></textarea>

                    </div>



                    <div class="form-row">


                        <div class="form-group">

                            <label>
                                City
                            </label>

                            <input
                                type="text"
                                id="city"
                                placeholder="City"
                                required
                            >

                        </div>



                        <div class="form-group">

                            <label>
                                State
                            </label>

                            <input
                                type="text"
                                id="state"
                                placeholder="State"
                                required
                            >

                        </div>


                    </div>



                    <div class="form-row">


                        <div class="form-group">

                            <label>
                                Pincode
                            </label>

                            <input
                                type="text"
                                id="pincode"
                                placeholder="6 digit pincode"
                                maxlength="6"
                                required
                            >

                        </div>



                        <div class="form-group">

                            <label>
                                Payment Method
                            </label>

                            <select id="paymentMethod">

                                <option value="COD">
                                    Cash on Delivery
                                </option>

                                <option value="UPI">
                                    UPI
                                </option>

                                <option value="Card">
                                    Credit / Debit Card
                                </option>

                            </select>

                        </div>


                    </div>



                    <button
                        type="submit"
                        class="btn btn-primary checkout-submit-btn"
                    >
                        Place Order →
                    </button>


                </form>

            </div>



            <!-- RIGHT SIDE -->

            <aside class="checkout-summary-card">

                <h2>
                    Order Summary
                </h2>


                <div id="checkoutItems"></div>



                <!-- COUPON -->

                <div class="coupon-box">

                    <h3>
                        Have a Coupon?
                    </h3>

                    <div class="coupon-input-row">

                        <input
                            type="text"
                            id="couponInput"
                            placeholder="Enter coupon"
                        >

                        <button
                            type="button"
                            onclick="applyCoupon()"
                            class="btn btn-secondary"
                        >
                            Apply
                        </button>

                    </div>

                    <p id="couponMessage"></p>

                </div>



                <div id="checkoutTotals"></div>


                <p class="secure-text">
                    🔒 Your order information is stored securely.
                </p>

            </aside>


        </div>

    </section>

</main>



<footer class="site-footer">

    <div class="container">

        <p>
            © 2026 ShopEase. All rights reserved.
        </p>

    </div>

</footer>



<script src="./js/data.js"></script>

<script src="./js/checkout.js"></script>


</body>

</html>

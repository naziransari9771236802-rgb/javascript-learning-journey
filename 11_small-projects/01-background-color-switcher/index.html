<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Switcher</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Background Color Switcher</h1>

        <div class="buttons">
            <button class="color-btn red" data-color="red">Red</button>
            <button class="color-btn blue" data-color="blue">Blue</button>
            <button class="color-btn green" data-color="green">Green</button>
            <button class="color-btn black" data-color="black">Black</button>
        </div>

        <p>Current Color: <span id="currentColor">White</span></p>

    </div>

    <script src="script.js"></script>
</body>
</html>

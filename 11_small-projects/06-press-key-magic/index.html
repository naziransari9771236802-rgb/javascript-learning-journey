<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Press Key Magic</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Press The Key</h1>

        <p class="instruction">
            Press any key on your keyboard
        </p>

        <div id="keyDisplay">
            ?
        </div>

        <div class="info">

            <div class="info-box">
                <span>Key</span>
                <strong id="keyName">-</strong>
            </div>

            <div class="info-box">
                <span>Code</span>
                <strong id="keyCode">-</strong>
            </div>

            <div class="info-box">
                <span>Which</span>
                <strong id="keyWhich">-</strong>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
